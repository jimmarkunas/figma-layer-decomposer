[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-layer-decomposer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Pillow", "numpy", "opencv-python-headless", "jsonschema", "PyYAML"]

[project.scripts]
clean-plate = "cleanplate.cli:main"
extract-master = "extract.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["cleanplate*", "decomposer*", "extract*"]
